<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Despensa Cero Desperdicio</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Despensa">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#4CAF50">
    
    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="loading" class="loading-screen">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <h1>Despensa Cero Desperdicio</h1>
            <p>Cargando aplicación...</p>
        </div>
    </div>
    
    <div id="app" class="app-container" style="display: none;">
        <!-- Header -->
        <header class="app-header">
            <h1 class="app-title">Despensa Cero Desperdicio</h1>
            <button id="add-product-btn" class="btn-primary add-product-btn" aria-label="Añadir producto">
                <i class="fas fa-plus"></i> Añadir
            </button>
        </header>
        
        <!-- Main Content -->
        <main class="app-main">
            <!-- Summary Cards -->
            <section class="summary-section">
                <div class="summary-card">
                    <div class="card-icon">
                        <i class="fas fa-box"></i>
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">Total Productos</h3>
                        <p class="card-value" id="total-products">0</p>
                    </div>
                </div>
                
                <div class="summary-card">
                    <div class="card-icon">
                        <i class="fas fa-fire"></i>
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">Urgentes</h3>
                        <p class="card-value" id="urgent-products">0</p>
                    </div>
                </div>
                
                <div class="summary-card">
                    <div class="card-icon">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">Próximos</h3>
                        <p class="card-value" id="warning-products">0</p>
                    </div>
                </div>
            </section>
            
            <!-- Product List -->
            <section class="products-section">
                <h2>Tu Inventario</h2>
                <div id="products-list" class="products-list">
                    <div class="empty-state">
                        <p>No hay productos en tu despensa aún</p>
                        <button id="add-first-product" class="btn-primary">Añadir primer producto</button>
                    </div>
                </div>
            </section>
        </main>
        
        <!-- Footer -->
        <footer class="app-footer">
            <button id="alerts-btn" class="footer-btn" aria-label="Alertas de expiración">
                <span>🔔</span>
                <span>Alertas</span>
                <span id="alerts-badge" class="alerts-badge hidden">0</span>
            </button>
            <button id="scan-btn" class="footer-btn" aria-label="Escanear código de barras">
                <span>📷</span>
                <span>Escanear</span>
            </button>
            <button id="home-btn" class="footer-btn active" aria-label="Inicio">
                <span>🏠</span>
                <span>Inicio</span>
            </button>
            <button id="recipes-btn" class="footer-btn" aria-label="Recetas">
                <span>🍳</span>
                <span>Recetas</span>
            </button>
        </footer>
        
        <!-- Modals will be injected here -->
        <div id="modals-container"></div>
    </div>
    
    <!-- JavaScript Files -->
    <script src="lib/html5-qrcode.js"></script>
    <script src="storage.js"></script>
    <script src="expiration-alerts.js"></script>
    <script src="scanner.js"></script>
    <script src="manual-form.js"></script>
    
    <!-- Usar versión simplificada de app.js -->
    <script src="app-simple.js"></script>
    
    <!-- Service Worker Registration -->
    <script src="register-sw.js"></script>
    
    <script>
        // Script adicional para manejar errores
        window.addEventListener('error', function(event) {
            console.error('❌ Error global:', event.error);
            
            // Intentar mostrar la aplicación de todos modos
            setTimeout(function() {
                const loading = document.getElementById('loading');
                const app = document.getElementById('app');
                
                if (loading) loading.style.display = 'none';
                if (app) app.style.display = 'block';
                
                console.log('🔄 Forzando visualización de la aplicación');
            }, 1000);
        });
        
        // Verificar carga de scripts
        window.addEventListener('load', function() {
            console.log('📦 Todos los recursos cargados');
            
            // Verificar que los scripts principales estén cargados
            const scripts = ['storage.js', 'app-simple.js'];
            scripts.forEach(function(script) {
                const scriptElements = document.querySelectorAll('script[src="' + script + '"]');
                if (scriptElements.length === 0) {
                    console.warn('⚠️ Script no encontrado:', script);
                } else {
                    console.log('✅ Script cargado:', script);
                }
            });
        });
    </script>
</body>
</html>
